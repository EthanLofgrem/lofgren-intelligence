name: postgres-proof

# Applies supabase/migrations to a REAL PostgreSQL 16 server (an ephemeral
# service container) on top of scripts/pg/bootstrap_supabase_stub.sql and runs
# tests/pg/test_migrations_pg.py against it. Any failure, error or skipped test
# fails the job: a skip here would mean nothing was proven.
#
# Scope: SQL/RPC behaviour, locking, concurrency and grants on real Postgres.
# Not covered: Supabase hosted auth, the RLS platform behind PostgREST and
# PostgREST's role switch (see the bootstrap stub's header).

on:
  push:
    branches:
      - "build/**"
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for a container that lives only for this job.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LI_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      # Inside CI the skip guard is off: a missing DSN or psycopg is an error.
      LI_PG_REQUIRED: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg and the package
        run: python -m pip install "psycopg[binary]>=3.1,<4" .
      - name: Check the PostgreSQL server
        run: |
          python - <<'EOF'
          import os, time
          import psycopg
          for attempt in range(30):
              try:
                  with psycopg.connect(os.environ["LI_PG_DSN"], connect_timeout=5) as conn:
                      print(conn.execute("select version()").fetchone()[0])
                      print("server_version_num", conn.execute("show server_version_num").fetchone()[0])
                      break
              except psycopg.OperationalError as exc:
                  print("waiting for postgres:", exc)
                  time.sleep(2)
          else:
              raise SystemExit("PostgreSQL never became reachable")
          EOF
      - name: Run the real-PostgreSQL proof
        run: |
          set -o pipefail
          python -m unittest -v tests.pg.test_migrations_pg 2>&1 | tee pg-proof.log
      - name: Refuse skipped tests
        run: |
          if grep -nE "skipped|expected failure|unexpected success" pg-proof.log; then
            echo "::error::postgres-proof skipped or mis-ran a test; a skip proves nothing"
            exit 1
          fi
          grep -E "^Ran [0-9]+ tests? in" pg-proof.log
          grep -qxE "OK" pg-proof.log
      - name: Publish per-test results
        # Job logs and artifacts need repository rights to download; check-run
        # annotations do not, so the per-test verdicts are also published there.
        if: always()
        run: |
          python - <<'EOF'
          import os, re
          from pathlib import Path
          log = Path("pg-proof.log")
          text = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
          lines = [f"{m.group(1)} ... {m.group(2).strip()}"
                   for m in re.finditer(r"^test_\S+ \(\S+?\.(\w+\.test_\w+)\) \.\.\. (.*)$", text, re.M)]
          lines += [l for l in text.splitlines() if re.match(r"^(Ran \d+ tests? in|OK\b|FAILED\b)", l)]
          if not lines:
              lines = ["no per-test results were found in pg-proof.log"]
          body = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### postgres-proof per-test results\n\n```\n" + body + "\n```\n")
          # An annotation message is cut at about 4 KB: publish numbered chunks.
          chunks, cur = [], []
          for line in lines:
              if cur and len("\n".join(cur + [line])) > 3000:
                  chunks.append(cur)
                  cur = []
              cur.append(line)
          chunks.append(cur)
          for i, chunk in enumerate(chunks, 1):
              esc = "\n".join(chunk).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=postgres-proof per-test results {i}/{len(chunks)}::" + esc)
          EOF
      - name: Capture the PostgreSQL server log
        if: always()
        run: docker logs "${{ job.services.postgres.id }}" > pg-server.log 2>&1
      - name: Upload the test and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-proof-log
          path: |
            pg-proof.log
            pg-server.log
          if-no-files-found: error
