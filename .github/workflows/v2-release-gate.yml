name: v2-release-gate

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: ["build/v2-complete"]

permissions:
  contents: read
  actions: read

jobs:
  exact-sha-v2-gate:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Verify exact SHA and clean tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact source
        run: python -m pip install .
      - name: Run V2ReadyForV3 exact-SHA gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/v2_gate.py --sha "${{ github.event.workflow_run.head_sha }}"
      - name: Verify tree remained clean
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
