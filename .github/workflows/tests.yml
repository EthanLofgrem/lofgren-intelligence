name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[hosted]"
      - name: Vercel uv runtime smoke
        run: |
          python -m pip install uv
          uv sync --frozen --no-dev
          uv run --frozen --no-dev python scripts/vercel_runtime_smoke.py
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Offline store contracts (network prohibited)
        run: python scripts/offline_store_contracts.py
      - name: Installed-package smoke test
        run: |
          python -c "import lofgren_intelligence; from lofgren_intelligence.discovery import DiscoveryContext"
          lofgren --help > /dev/null
      - name: CLI smoke test
        run: |
          python -m lofgren_intelligence estimate "Is industrial construction in the Phoenix metro increasing?" --files examples/sample-sources
          python -m lofgren_intelligence investigate "Is industrial construction in the Phoenix metro increasing?" --files examples/sample-sources > /dev/null
          python -m lofgren_intelligence produce "Is industrial construction in the Phoenix metro increasing?" --files examples/sample-sources --goal "Choose a warehouse size (fictional)" --design examples/designs/warehouse.json --out-dir "$RUNNER_TEMP/v3-artifact"
          python -m lofgren_intelligence verify-artifact "$RUNNER_TEMP/v3-artifact"
          (cd "$RUNNER_TEMP/v3-artifact" && python -m unittest -v test_artifact)
      - name: V1 certification gate
        run: python -m lofgren_intelligence certify
      - name: V2 discovery certification
        run: python -m lofgren_intelligence certify --v2
      - name: V3 production certification
        run: python -m lofgren_intelligence certify --v3
      - name: V4 execution certification
        run: python -m lofgren_intelligence certify --v4
      - name: V5 outcome certification
        run: python -m lofgren_intelligence certify --v5
      - name: V6 improvement certification
        run: python -m lofgren_intelligence certify --v6
      - name: Static check
        run: |
          python -m compileall -q lofgren_intelligence
          python -m py_compile api/index.py
      - name: Package smoke test (clean wheel, installed and run outside the source tree)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "mcp>=2,<3" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import lofgren_intelligence, lofgren_intelligence.discovery.context, lofgren_intelligence.discovery.schemas; print(lofgren_intelligence.__file__)"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import importlib.resources as r; d = r.files('lofgren_intelligence.hosted').joinpath('static'); import hashlib, base64; assert all(d.joinpath(n).is_file() for n in ('site.css', 'site.js', 'mark.svg', 'vendor/supabase-js-2.117.2.umd.js', 'vendor/README.md')), 'static site assets missing from wheel'; assert base64.b64encode(hashlib.sha384(d.joinpath('vendor/supabase-js-2.117.2.umd.js').read_bytes()).digest()).decode() == 'Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok', 'vendored supabase-js integrity mismatch'; print('static-assets-ok')"
          "$RUNNER_TEMP/wheel-env/bin/lofgren" certify
          "$RUNNER_TEMP/wheel-env/bin/lofgren" certify --v2
          "$RUNNER_TEMP/wheel-env/bin/lofgren" certify --v3
          "$RUNNER_TEMP/wheel-env/bin/lofgren" certify --v4
          "$RUNNER_TEMP/wheel-env/bin/lofgren" certify --v5
          "$RUNNER_TEMP/wheel-env/bin/lofgren" certify --v6
          python "$GITHUB_WORKSPACE/scripts/installed_mcp_smoke.py" "$RUNNER_TEMP/wheel-env/bin/lofgren"
      - name: V1 -> V2 boundary certification
        run: |
          python -m lofgren_intelligence certify-boundary
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/lofgren" certify-boundary

  v2-ready-for-v3:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'build/v2-complete' || github.ref_name == 'build/public-v2-integration' || github.ref_name == 'build/release-candidate' || github.ref_name == 'build/rc-durable-jobs' || github.ref_name == 'build/rc-supabase-pin' || github.ref_name == 'build/rc-plan-catalog' || github.ref_name == 'build/rc-integrated' || github.ref_name == 'build/rc-clarification-domains' || github.ref_name == 'build/rc-candidate-3') }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source
        run: python -m pip install ".[hosted]"
      - name: Exact-SHA V2ReadyForV3 gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/v2_gate.py --sha "${{ github.sha }}" --ci-run-id "${{ github.run_id }}"


  v3-ready-for-v4:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'build/v3-production' || github.ref_name == 'build/v3-complete' || github.ref_name == 'release/public-v1-v6' || github.ref_name == 'build/public-ops-hardening' || github.ref_name == 'build/public-hardening-rebased' || github.ref_name == 'build/release-candidate' || github.ref_name == 'build/rc-durable-jobs' || github.ref_name == 'build/rc-supabase-pin' || github.ref_name == 'build/rc-plan-catalog' || github.ref_name == 'build/rc-integrated' || github.ref_name == 'build/rc-clarification-domains' || github.ref_name == 'build/rc-candidate-3') }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source
        run: python -m pip install ".[hosted]"
      - name: Exact-SHA V3ReadyForV4 gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/v3_gate.py --sha "${{ github.sha }}" --ci-run-id "${{ github.run_id }}"


  v4-ready-for-v5:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'build/v4-execution' || github.ref_name == 'release/public-v1-v6' || github.ref_name == 'build/public-ops-hardening' || github.ref_name == 'build/public-hardening-rebased' || github.ref_name == 'build/release-candidate' || github.ref_name == 'build/rc-durable-jobs' || github.ref_name == 'build/rc-supabase-pin' || github.ref_name == 'build/rc-plan-catalog' || github.ref_name == 'build/rc-integrated' || github.ref_name == 'build/rc-clarification-domains' || github.ref_name == 'build/rc-candidate-3') }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source
        run: python -m pip install ".[hosted]"
      - name: Exact-SHA V4ReadyForV5 gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/v4_gate.py --sha "${{ github.sha }}" --ci-run-id "${{ github.run_id }}"


  v5-ready-for-v6:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'build/v5-outcomes' || github.ref_name == 'release/public-v1-v6' || github.ref_name == 'build/public-ops-hardening' || github.ref_name == 'build/public-hardening-rebased' || github.ref_name == 'build/release-candidate' || github.ref_name == 'build/rc-durable-jobs' || github.ref_name == 'build/rc-supabase-pin' || github.ref_name == 'build/rc-plan-catalog' || github.ref_name == 'build/rc-integrated' || github.ref_name == 'build/rc-clarification-domains' || github.ref_name == 'build/rc-candidate-3') }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source
        run: python -m pip install ".[hosted]"
      - name: Exact-SHA V5ReadyForV6 gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/v5_gate.py --sha "${{ github.sha }}" --ci-run-id "${{ github.run_id }}"


  v6-complete:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'build/v6-improve' || github.ref_name == 'release/public-v1-v6' || github.ref_name == 'build/public-ops-hardening' || github.ref_name == 'build/public-hardening-rebased' || github.ref_name == 'build/release-candidate' || github.ref_name == 'build/rc-durable-jobs' || github.ref_name == 'build/rc-supabase-pin' || github.ref_name == 'build/rc-plan-catalog' || github.ref_name == 'build/rc-integrated' || github.ref_name == 'build/rc-clarification-domains' || github.ref_name == 'build/rc-candidate-3') }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source
        run: python -m pip install ".[hosted]"
      - name: Exact-SHA V6 completion gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/v6_gate.py --sha "${{ github.sha }}" --ci-run-id "${{ github.run_id }}"
